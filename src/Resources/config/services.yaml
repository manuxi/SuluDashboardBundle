services:
    _defaults:
        autowire: false
        autoconfigure: false
        public: false

    sulu_dashboard.widget_registry:
        class: Manuxi\SuluDashboardBundle\Widget\WidgetRegistry
        arguments:
            $sources: [] # filled by DashboardWidgetPass
            $securityChecker: '@sulu_security.security_checker'
            $disabled: '%sulu_dashboard.disabled_widgets%'

    Manuxi\SuluDashboardBundle\Widget\WidgetRegistry:
        alias: sulu_dashboard.widget_registry

    sulu_dashboard.tab_registry:
        class: Manuxi\SuluDashboardBundle\Tab\TabRegistry
        arguments:
            $sources: [] # filled by DashboardTabPass
            $securityChecker: '@sulu_security.security_checker'

    Manuxi\SuluDashboardBundle\Content\ContentReader:
        arguments:
            - '@doctrine.dbal.default_connection'
            - '@sulu_security.security_checker'
            - '@sulu_core.webspace.webspace_manager'
            - '@sulu.core.localization_manager'
            - '@sulu_admin.metadata_group_provider'

    Manuxi\SuluDashboardBundle\Admin\DashboardAdmin:
        arguments:
            - '@sulu_admin.view_builder_factory'
            - '@sulu_security.security_checker'
            - '@sulu.core.localization_manager'
            - '@sulu_dashboard.widget_registry'
            - '@sulu_admin.metadata_provider_registry'
            - '%sulu_dashboard.start_page%'
            - '@sulu_dashboard.tab_registry'
            - '%sulu_dashboard.tabs.replace_navigation%'
            - '%sulu_dashboard.layout.balance%'
        tags:
            - { name: sulu.admin }
            - { name: sulu.context, context: admin }

    Manuxi\SuluDashboardBundle\Controller\Admin\WidgetController:
        public: true
        arguments:
            - '@sulu_dashboard.widget_registry'
            - '@sulu.core.localization_manager'
            - '@?logger'
        tags:
            - { name: controller.service_arguments }
            - { name: sulu.context, context: admin }

    Manuxi\SuluDashboardBundle\Command\DashboardDumpCommand:
        arguments:
            - '@sulu_dashboard.widget_registry'
            - '@sulu.repository.user'
            - '@security.token_storage'
            - '@sulu.core.localization_manager'
            - '@sulu_security.system_store'
        tags:
            - { name: console.command }
            - { name: sulu.context, context: admin }

    Manuxi\SuluDashboardBundle\Command\SystemCheckCommand:
        arguments:
            - '@Manuxi\SuluDashboardBundle\System\SystemChecker'
        tags:
            - { name: console.command }
            - { name: sulu.context, context: admin }

    # "System" tile: the slow checks run in the console command and are left in the cache (cache.app of the admin
    # context, the same pool the admin reads)
    Manuxi\SuluDashboardBundle\System\SystemVersions:
        factory: ['Manuxi\SuluDashboardBundle\System\SystemVersions', 'detect']

    Manuxi\SuluDashboardBundle\System\SystemCheckStore:
        arguments: ['@cache.app']

    Manuxi\SuluDashboardBundle\System\ComposerAuditRunner:
        arguments:
            - '%kernel.project_dir%'
            - '%sulu_dashboard.system.composer_binary%'

    Manuxi\SuluDashboardBundle\System\StorageMeasurer:
        arguments: ['%kernel.project_dir%']

    Manuxi\SuluDashboardBundle\System\SystemChecker:
        arguments:
            - '@Manuxi\SuluDashboardBundle\System\ComposerAuditRunner'
            - '@Manuxi\SuluDashboardBundle\System\StorageMeasurer'
            - '@Manuxi\SuluDashboardBundle\System\SystemCheckStore'

    # optional: only when doctrine/migrations and a failure transport of Messenger are configured, otherwise null
    Manuxi\SuluDashboardBundle\System\PendingMigrations:
        arguments: ['@?doctrine.migrations.dependency_factory']

    Manuxi\SuluDashboardBundle\System\FailedMessages:
        arguments: ['@?messenger.failure_transports.default']

    # Built-in tiles. They use the same interface as the tiles of other bundles.
    Manuxi\SuluDashboardBundle\Widget\Builtin\PagesCountWidget:
        arguments: ['@Manuxi\SuluDashboardBundle\Content\ContentReader']
        tags: ['sulu_dashboard.widget']

    Manuxi\SuluDashboardBundle\Widget\Builtin\ArticlesCountWidget:
        arguments: ['@Manuxi\SuluDashboardBundle\Content\ContentReader']
        tags: ['sulu_dashboard.widget']

    Manuxi\SuluDashboardBundle\Widget\Builtin\SnippetsCountWidget:
        arguments: ['@Manuxi\SuluDashboardBundle\Content\ContentReader']
        tags: ['sulu_dashboard.widget']

    Manuxi\SuluDashboardBundle\Widget\Builtin\MediaCountWidget:
        arguments: ['@Manuxi\SuluDashboardBundle\Content\ContentReader']
        tags: ['sulu_dashboard.widget']

    Manuxi\SuluDashboardBundle\Widget\Builtin\OpenItemsWidget:
        arguments: ['@Manuxi\SuluDashboardBundle\Content\ContentReader']
        tags: ['sulu_dashboard.widget']

    Manuxi\SuluDashboardBundle\Widget\Builtin\SeoWidget:
        arguments: ['@Manuxi\SuluDashboardBundle\Content\ContentReader']
        tags: ['sulu_dashboard.widget']

    Manuxi\SuluDashboardBundle\Widget\Builtin\TranslationsWidget:
        arguments:
            - '@Manuxi\SuluDashboardBundle\Content\ContentReader'
            - '@sulu.core.localization_manager'
        tags: ['sulu_dashboard.widget']

    Manuxi\SuluDashboardBundle\Widget\Builtin\ActivitiesWidget:
        tags: ['sulu_dashboard.widget']

    Manuxi\SuluDashboardBundle\Widget\Builtin\SystemWidget:
        arguments:
            - '@Manuxi\SuluDashboardBundle\System\SystemVersions'
            - '%kernel.environment%'
            - '%kernel.debug%'
            - '@Manuxi\SuluDashboardBundle\System\SystemCheckStore'
            - '@Manuxi\SuluDashboardBundle\System\PendingMigrations'
            - '@Manuxi\SuluDashboardBundle\System\FailedMessages'
            - '%sulu_dashboard.system.max_age%'
            - '@?logger'
        tags: ['sulu_dashboard.widget']
